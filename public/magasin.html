<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090d10"><title>3iS Lyon — Magasin</title><link rel="icon" type="image/png" href="assets/favicon-rouge.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body class="magasin-page"><header class="topbar magasin-top"><a class="brand" href="/"><img src="assets/logo-rouge.png" alt="3iS"></a><div><p class="eyebrow">ESPACE INTERNE</p><strong>MAGASIN 3iS LYON</strong></div><button id="logout" class="page-btn">DÉCONNEXION</button></header><main class="magasin-shell"><section id="loginPanel" class="magasin-login"><p class="eyebrow">ACCÈS MAGASIN</p><h1>GESTION DU MATÉRIEL</h1><p>Entre le code d'accès interne pour gérer les demandes, préparations, retraits et retours.</p><form id="loginForm"><input id="operator" autocomplete="name" placeholder="Prénom / nom de l'opérateur" required><input id="secret" type="password" autocomplete="current-password" placeholder="Code d'accès magasin" required><button class="primary-wide">OUVRIR L'ESPACE MAGASIN</button></form></section><section id="adminPanel" class="hidden"><div class="magasin-heading"><div><p class="eyebrow">PILOTAGE DU MAGASIN</p><h1>TABLEAU DE BORD</h1></div><div class="magasin-view-switch"><button data-view="requests" class="active">DEMANDES</button><button data-view="calendar">CALENDRIER</button></div></div><div id="dashboardStats" class="dashboard-stats"></div><section id="requestsView"><div class="magasin-filters"><button data-status="all" class="active">ACTIVES</button><button data-status="pending">EN ATTENTE</button><button data-status="preparing">À PRÉPARER</button><button data-status="ready">PRÊTES</button><button data-
